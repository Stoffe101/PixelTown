name: Godot CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

# Public-repository workflows are untrusted: don't provide write tokens or secrets.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: '4.7.2'

jobs:
  linux-and-visual:
    name: Linux, unit tests, rendered resolutions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout, without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check repository and licensing contracts
        run: python3 tools/ci/check_repo.py

      - name: Checkout pinned creator CC0 artwork (no upstream code imported)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: pixel-boy/NinjaAdventure
          ref: 6ac78232d5aedcc85ce5f27d060ea92366f7c24a
          path: _vendor_reference/ninja
          persist-credentials: false

      - name: Verify and import selected CC0 environment textures
        run: python3 tools/art/import_ninja_cc0.py --source _vendor_reference/ninja

      - name: Verify temporary CC0 house atlas PNG
        shell: bash
        run: python3 tools/art/repair_curated_png.py

      - name: Build original PNG sprites and verify art contracts
        shell: bash
        run: |
          python3 tools/art/build_art.py
          python3 tools/art/validate_assets.py

      - name: Install pinned Godot and verify release hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Godot version and asset import/parse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs
          godot --version
          timeout 120s godot --headless --editor --import --path . --log-file artifacts/logs/linux-import.log 2>&1 | tee artifacts/logs/linux-import.stdout.log
          python3 tools/ci/check_engine_log.py artifacts/logs/linux-import.stdout.log

      - name: Engine unit tests and runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path . --script res://tests/ci_runner.gd --log-file artifacts/logs/linux-unit.log 2>&1 | tee artifacts/logs/linux-unit.stdout.log
          python3 tools/ci/check_engine_log.py artifacts/logs/linux-unit.stdout.log
          timeout 120s godot --headless --path . --quit-after 12 --log-file artifacts/logs/linux-smoke.log 2>&1 | tee artifacts/logs/linux-smoke.stdout.log
          python3 tools/ci/check_engine_log.py artifacts/logs/linux-smoke.stdout.log

      - name: Ensure virtual display is available
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb
          fi

      - name: Render and validate 16:9 and ultrawide screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/screenshots
          # Same camera/art at 16:9 and 21:9, with both proposed sprite sizes.
          while read -r width height mode scale seconds zoom; do
            [ -z "$width" ] && continue
            stem="${width}x${height}-${mode}-scale${scale}-zoom${zoom:-1}"
            output="artifacts/screenshots/${stem}.png"
            timeout 120s xvfb-run -a -s '-screen 0 3440x1440x24 -ac +extension GLX +render -noreset' \
              godot --audio-driver Dummy --path . --rendering-method gl_compatibility --resolution "${width}x${height}" --windowed \
              --script res://tests/visual/capture.gd -- "$width" "$height" "$output" "$mode" "$scale" "$seconds" "${zoom:-1}" \
              2>&1 | tee "artifacts/logs/render-${stem}.log"
            python3 tools/ci/check_engine_log.py "artifacts/logs/render-${stem}.log"
            python3 tools/ci/verify_png.py "$output" "$width" "$height"
          done <<'CAPTURES'
          1440 810 village 1 12 1
          1920 1080 village 0 5 1
          1920 1080 village 1 18 1
          2560 1440 village 1 20 1
          3440 1440 village 0 5 1
          3440 1440 village 1 18 1
          1920 1080 cave 1 8 1
          3440 1440 cave 1 8 1
          1920 1080 village 1 18 2
          3440 1440 cave 1 8 2
          CAPTURES

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## PixelTown Prototype 00 art review' >> "$GITHUB_STEP_SUMMARY"
          echo 'Godot 4.7.2; Linux + Windows checks, deterministic worker test, and actual Godot village/cave renders.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Resolution coverage: 1920x1080, 2560x1440, 3440x1440.' >> "$GITHUB_STEP_SUMMARY"
          echo 'All output atlases are attached as PNG and JSON artifacts. Compare both proposed sprite scales. **These are unapproved prototype art candidates, not visual baselines or final game art.**' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p artifacts/atlases
          cp assets/*.png assets/atlas.json artifacts/atlases/
          mkdir -p artifacts/cc0_sources
          cp assets/third_party/ninja_adventure/PROVENANCE.json artifacts/cc0_sources/
          cp assets/third_party/ninja_adventure/*.png artifacts/cc0_sources/
          for capture in artifacts/screenshots/*.png; do
            if test -f "$capture"; then echo "- $(basename "$capture")" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Attach render evidence and failure logs (no baseline updates)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: linux-godot-evidence
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  windows-smoke:
    name: Windows Godot parse, unit tests, smoke
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout, without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned Windows Godot and verify hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest -Uri $uri -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') {
            throw "Windows Godot checksum mismatch: $actual"
          }
          $dest = Join-Path $env:RUNNER_TEMP 'godot'
          Expand-Archive -Path $zip -DestinationPath $dest
          $exe = Get-ChildItem $dest -Recurse -Filter '*win64_console.exe' | Select-Object -First 1
          if ($null -eq $exe) { throw 'Godot console executable not found' }
          Add-Content -Path $env:GITHUB_ENV -Value "GODOT_EXE=$($exe.FullName)"

      - name: Checkout pinned creator CC0 artwork on Windows
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: pixel-boy/NinjaAdventure
          ref: 6ac78232d5aedcc85ce5f27d060ea92366f7c24a
          path: _vendor_reference/ninja
          persist-credentials: false

      - name: Verify and import selected CC0 environment textures on Windows
        shell: pwsh
        run: |
          python tools/art/import_ninja_cc0.py --source _vendor_reference/ninja
          if ($LASTEXITCODE -ne 0) { throw 'CC0 source asset validation failed' }

      - name: Verify temporary CC0 house atlas PNG on Windows
        shell: pwsh
        run: |
          python tools/art/repair_curated_png.py
          if ($LASTEXITCODE -ne 0) { throw 'CC0 house atlas integrity failed' }

      - name: Build and validate original art on Windows
        shell: pwsh
        run: |
          python tools/art/build_art.py
          if ($LASTEXITCODE -ne 0) { throw 'Art generation failed' }
          python tools/art/validate_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Art validation failed' }

      - name: Project import, unit tests and boot on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/logs | Out-Null
          & $env:GODOT_EXE --version
          & $env:GODOT_EXE --headless --editor --import --path . --log-file artifacts/logs/windows-import.log
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/logs/windows-import.log -ErrorAction SilentlyContinue; throw "Windows import failed, exit code $LASTEXITCODE" }
          python tools/ci/check_engine_log.py artifacts/logs/windows-import.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows import log contains errors' }
          & $env:GODOT_EXE --headless --path . --script res://tests/ci_runner.gd --log-file artifacts/logs/windows-unit.log
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/logs/windows-unit.log -ErrorAction SilentlyContinue; throw 'Windows unit tests failed' }
          python tools/ci/check_engine_log.py artifacts/logs/windows-unit.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows test log contains errors' }
          & $env:GODOT_EXE --headless --path . --quit-after 12 --log-file artifacts/logs/windows-smoke.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows game boot failed' }
          python tools/ci/check_engine_log.py artifacts/logs/windows-smoke.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows smoke log contains errors' }

      - name: Attach Windows failure logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-godot-logs
          path: artifacts/logs/
          retention-days: 7
          if-no-files-found: warn
