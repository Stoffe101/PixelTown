name: Commit Real Art Assets (feature branch only)

on:
  push:
    branches:
      - prototype/art-direction-v1-00b
    paths:
      - 'tools/art/**'
      - 'tools/ci/**'
      - 'scenes/levels/**'
      - '.github/workflows/publish-real-assets.yml'
  workflow_dispatch:

# This workflow acts ONLY on this trusted project-owned feature branch.
# It does not execute on untrusted PRs or the main branch.
permissions:
  contents: write

concurrency:
  group: publish-real-assets-feature
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/prototype/art-direction-v1-00b'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch with write token
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: prototype/art-direction-v1-00b
          persist-credentials: true

      - name: Checkout pinned CC0 artist source, read only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: pixel-boy/NinjaAdventure
          ref: 6ac78232d5aedcc85ce5f27d060ea92366f7c24a
          path: _vendor_reference/ninja
          persist-credentials: false

      - name: Generate real PNG art and layered sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
          python3 tools/art/import_ninja_cc0.py --source _vendor_reference/ninja
          python3 tools/art/curate_v4_houses.py
          python3 tools/art/build_art.py
          python3 tools/art/hero_art.py
          python3 tools/art/validate_assets.py
          python3 tools/art/validate_hero.py

      - name: Install pinned Godot for one-time terrain bake
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Bake initial terrain into editable scene files (once)
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --editor --import --path .
          timeout 120s godot --headless --path . --script res://tools/art/bake_starter_layout.gd

      - name: Commit complete real assets and painted level scenes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PixelTown Art CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.png assets/atlas.json
          git add assets/original/hero/*.png art/source/architecture/*.ora
          git add assets/third_party/ninja_adventure/*.png assets/third_party/ninja_adventure/PROVENANCE.json
          git add assets/terrain_paint_tileset.tres scenes/levels/village_layout.tscn scenes/levels/cave_layout.tscn
          if ! git diff --cached --quiet; then
            git commit -m "assets: commit actual PNGs, layered art masters and editable painted maps"
            git push origin HEAD:prototype/art-direction-v1-00b
          else
            echo "Nothing new to commit."
          fi
